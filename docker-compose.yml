name: task-management

services:
  backend:
    image: task-management-backend
    build: ./backend
    restart: unless-stopped
    environment:
      APP_NAME: Tasks
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?}
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-transcosmos}
      DB_USERNAME: ${DB_USERNAME:-transcosmos}
      DB_PASSWORD: ${DB_PASSWORD:?}
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:?}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?}
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-tasks@example.com}
      MAIL_FROM_NAME: Tasks
    ports:
      - "${WS_PORT:-8080}:8080"
    volumes:
      - storage:/var/www/html/storage
    stop_grace_period: 900s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${API_PORT:-8000}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    image: task-management-frontend
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY:?}
        NEXT_PUBLIC_REVERB_HOST: ${REVERB_PUBLIC_HOST:-localhost}
        NEXT_PUBLIC_REVERB_PORT: ${REVERB_PUBLIC_PORT:-8080}
        NEXT_PUBLIC_REVERB_SCHEME: ${REVERB_PUBLIC_SCHEME:-http}
    restart: unless-stopped
    environment:
      API_URL: http://nginx/api
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      nginx:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-transcosmos}
      MYSQL_USER: ${DB_USERNAME:-transcosmos}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
  redis-data:
  storage:
