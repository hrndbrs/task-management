openapi: 3.1.0
info:
  title: Task Management Platform API
  version: 1.0.0
  description: |
    REST API for the task management platform (Laravel 13).

    **Authentication.** Call `POST /auth/login` to get a JWT, then send it on every other request as
    `Authorization: Bearer <token>`. Tokens live for 60 minutes (`JWT_TTL`). `POST /auth/logout`
    blacklists the token.

    **Errors.** All errors are JSON with a `message`. Validation failures (422) also carry an `errors`
    object keyed by field, each holding a list of messages.

    **Real-time.** Changes are broadcast over Laravel Reverb (Pusher protocol). Private channels are
    authorized through `POST /broadcasting/auth`. See `documentation/architecture.md` for the channels
    and event payloads.
servers:
  - url: http://localhost:8000/api
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Log in, log out and read the current user.
  - name: Users
    description: People who can be assigned tasks.
  - name: Tasks
    description: Create, read, update, delete and list tasks.
  - name: Bulk operations
    description: Queued status changes across many tasks.
  - name: Comments
    description: Discussion on a task, broadcast live.
  - name: Attachments
    description: 'Files on a task: upload, download, thumbnails and delete.'
  - name: Attachment versions
    description: Earlier versions of a file, and restoring them.
  - name: Chunked uploads
    description: Uploading files over 50 MB in 5 MB pieces.
  - name: Exports
    description: Queued CSV and PDF reports of tasks.
  - name: Broadcasting
    description: Authorizing private WebSocket channels.

paths:
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Log in and receive a JWT
      description: Rate limited to 5 attempts per minute per email and IP address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: admin@example.com }
                password: { type: string, example: password }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, const: bearer }
                  expires_in: { type: integer, description: Seconds until the token expires, example: 3600 }
                  user: { $ref: '#/components/schemas/AuthUser' }
        '401':
          description: Wrong email or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: The provided credentials are incorrect. }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Log out and invalidate the token
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: Logged out successfully. }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Get the signed-in user
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List all users
      description: Sorted by name. Used to pick an assignee.
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /tasks:
    get:
      operationId: listTasks
      tags: [Tasks]
      summary: List tasks
      description: Paginated, filterable and sortable. Attachments are not included in list items.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TaskStatus' } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/TaskPriority' } }
        - { name: assigned_user_id, in: query, schema: { type: integer } }
        - { name: created_by, in: query, schema: { type: integer } }
        - name: search
          in: query
          description: Case-insensitive substring match on the title.
          schema: { type: string, maxLength: 255 }
        - name: sort
          in: query
          description: Status and priority sort by their logical order (pending → cancelled, low → urgent), not alphabetically.
          schema: { type: string, enum: [title, status, priority, due_date, created_at], default: created_at }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 15 } }
      responses:
        '200':
          description: A page of tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      operationId: createTask
      tags: [Tasks]
      summary: Create a task
      description: The signed-in user becomes the creator. If the task is assigned to someone else, they are emailed (queued).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
            example:
              title: Prepare quarterly report
              description: Numbers from finance are in the shared drive.
              status: pending
              priority: high
              assigned_user_id: 2
              due_date: '2026-10-15'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tasks/{task}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      operationId: getTask
      tags: [Tasks]
      summary: Get a task with its attachments
      description: Includes the latest version of each attachment, oldest upload first.
      responses:
        '200':
          description: The task
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Task'
                      - type: object
                        properties:
                          attachments:
                            type: array
                            items: { $ref: '#/components/schemas/Attachment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateTask
      tags: [Tasks]
      summary: Update a task
      description: |
        Allowed for admins, the creator and the assignee. Only the fields sent are changed.
        Changing the assignee emails the new assignee (queued). `PATCH` behaves the same.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 255 }
                description: { type: [string, 'null'] }
                status: { $ref: '#/components/schemas/TaskStatus' }
                priority: { $ref: '#/components/schemas/TaskPriority' }
                assigned_user_id: { type: [integer, 'null'] }
                due_date: { type: [string, 'null'], format: date }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteTask
      tags: [Tasks]
      summary: Delete a task
      description: Allowed for admins and the creator. Also deletes its comments, attachments (all versions, with their files) and unfinished chunked uploads.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/bulk-status:
    post:
      operationId: bulkUpdateTaskStatus
      tags: [Bulk operations]
      summary: Change the status of many tasks in the background
      description: |
        Queues the update as a job batch (100 tasks per job) and returns immediately with the batch
        to poll. The user must be allowed to update every task, otherwise nothing is queued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_ids, status]
              properties:
                task_ids:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  uniqueItems: true
                  items: { type: integer }
                status: { $ref: '#/components/schemas/TaskStatus' }
            example: { task_ids: [1, 2, 3], status: completed }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BulkOperation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Not allowed to update some of the tasks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: 'You are not allowed to update these tasks: 4, 9.' }
        '422':
          description: Invalid input, or some task ids do not exist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                message: 'These tasks do not exist: 999.'
                errors: { task_ids: ['These tasks do not exist: 999.'] }

  /tasks/bulk-status/{batchId}:
    get:
      operationId: getBulkStatusUpdate
      tags: [Bulk operations]
      summary: Check a bulk status update
      description: Only the user who started the batch can see it; anyone else gets 404.
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Batch progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BulkOperation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{task}/comments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      operationId: listComments
      tags: [Comments]
      summary: List a task's comments
      description: Oldest first, with each author.
      responses:
        '200':
          description: Comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Comment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createComment
      tags: [Comments]
      summary: Comment on a task
      description: |
        Any signed-in user can comment. Surrounding whitespace is trimmed. Broadcasts
        `comment.posted` on `private-tasks.{task}`. Rate limited to 30 comments per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string, maxLength: 5000 }
            example: { comment: Looks good to me. }
      responses:
        '201':
          description: Posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Comment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /comments/{comment}:
    delete:
      operationId: deleteComment
      tags: [Comments]
      summary: Delete a comment
      description: Allowed for the author and admins. Broadcasts `comment.deleted` on `private-tasks.{task}`.
      parameters:
        - { name: comment, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/{task}/attachments:
    post:
      operationId: uploadAttachment
      tags: [Attachments]
      summary: Upload a file to a task
      description: |
        Allowed for users who can update the task. Files up to 50 MB; larger files use the
        chunked upload endpoints. The file type is checked from its content, not only its name.

        The new attachment starts with `scan_status: pending`. A queued virus scan then marks it
        `clean` (and queues a thumbnail for images, or a poster thumbnail and HLS stream for videos)
        or `infected` (and deletes the file).
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 'Max 50 MB. Allowed: jpg, jpeg, png, gif, webp, pdf, doc, docx, xls, xlsx, ppt, pptx, txt, csv, mp4, webm, mov.'
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Attachment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: The request body is larger than the server accepts (PHP `post_max_size`) }
        '422': { $ref: '#/components/responses/ValidationError' }

  /attachments/{attachment}/download:
    get:
      operationId: downloadAttachment
      tags: [Attachments]
      summary: Download a file
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: The file, sent as an attachment with its original name
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The virus scan has not finished yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: This file is still being scanned for viruses. }
        '410':
          description: The file failed the virus scan and was removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: This file was removed because it failed the virus scan. }

  /attachments/{attachment}/thumbnail:
    get:
      operationId: getAttachmentThumbnail
      tags: [Attachments]
      summary: Get an image attachment's thumbnail
      description: A WebP image scaled to fit 300×300. Only exists for clean images.
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: The thumbnail
          content:
            image/webp:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attachments/{attachment}/stream/{path}:
    get:
      operationId: streamVideo
      tags: [Attachments]
      summary: Stream a video (HLS)
      description: |
        Videos are transcoded in the background into an HLS stream with several quality levels
        (360p, 720p and 1080p, never above the source resolution). Once `stream_status` is `ready`,
        point an HLS player at `master.m3u8` (the attachment's `stream_url`). The playlists use
        relative paths, so the player requests the quality playlists and segments from this same endpoint.
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
        - name: path
          in: path
          required: true
          description: '`master.m3u8`, `stream_{n}/index.m3u8` or `stream_{n}/seg_{nnn}.ts`. Anything else returns 404.'
          schema: { type: string, example: master.m3u8 }
      responses:
        '200':
          description: A playlist or a video segment
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
            video/mp2t:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: 'Not a video, the stream is not ready yet, or no such playlist or segment' }

  /attachments/{attachment}:
    delete:
      operationId: deleteAttachment
      tags: [Attachments]
      summary: Delete a file and all its versions
      description: Allowed for users who can update the task.
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attachments/{attachment}/versions:
    parameters:
      - $ref: '#/components/parameters/AttachmentId'
    get:
      operationId: listAttachmentVersions
      tags: [Attachment versions]
      summary: List every version of a file
      description: Newest version first. Pass the id of any version.
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Attachment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: uploadAttachmentVersion
      tags: [Attachment versions]
      summary: Upload a new version of a file
      description: Same rules as a normal upload. The new version gets the next version number and is scanned like any upload.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: New version created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Attachment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /attachments/{attachment}/restore:
    post:
      operationId: restoreAttachmentVersion
      tags: [Attachment versions]
      summary: Restore an older version
      description: Creates a new latest version with the same file as the given version. Only versions that passed the virus scan can be restored.
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '201':
          description: Restored as a new version
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Attachment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The version did not pass the virus scan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: Only a version that passed the virus scan can be restored. }

  /tasks/{task}/attachments/uploads:
    post:
      operationId: startChunkedUpload
      tags: [Chunked uploads]
      summary: Start a chunked upload
      description: |
        For files over 50 MB (up to 2 GB). The response says how big each chunk must be and how many
        to send. Send every chunk to `POST /uploads/{upload}/chunks/{index}`, then call
        `POST /uploads/{upload}/complete`. Unfinished uploads expire after 24 hours.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_name, file_size]
              properties:
                file_name: { type: string, maxLength: 255, description: Must end in an allowed extension. }
                file_size: { type: integer, minimum: 1, maximum: 2147483648, description: Bytes. }
                attachment_id:
                  type: [integer, 'null']
                  description: Upload as a new version of this attachment (must belong to the same task).
            example: { file_name: site-walkthrough.mp4, file_size: 62914560 }
      responses:
        '201':
          description: Upload started
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ChunkedUpload' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /uploads/{upload}:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    get:
      operationId: getChunkedUpload
      tags: [Chunked uploads]
      summary: Check which chunks have arrived
      description: Only the user who started the upload can see it. Use `received_chunks` to resume an interrupted upload.
      responses:
        '200':
          description: Upload state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ChunkedUpload' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: cancelChunkedUpload
      tags: [Chunked uploads]
      summary: Cancel a chunked upload
      description: Deletes the stored chunks.
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /uploads/{upload}/chunks/{index}:
    post:
      operationId: uploadChunk
      tags: [Chunked uploads]
      summary: Send one chunk
      description: Chunks can be sent in any order and resent. Every chunk must be exactly `chunk_size` bytes, except the last, which holds the remainder.
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - { name: index, in: path, required: true, description: 'Zero-based, below total_chunks.', schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [chunk]
              properties:
                chunk: { type: string, format: binary }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ChunkedUpload' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Index out of range, or the chunk has the wrong size
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                message: The chunk must be exactly 5242880 bytes.
                errors: { chunk: [The chunk must be exactly 5242880 bytes.] }

  /uploads/{upload}/complete:
    post:
      operationId: completeChunkedUpload
      tags: [Chunked uploads]
      summary: Assemble the chunks into an attachment
      description: Checks that every chunk arrived and that the assembled file's content is an allowed type, then creates the attachment (queued for a virus scan like any upload).
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '201':
          description: Attachment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Attachment' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Another request is already completing this upload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: This upload is already being completed. }
        '422':
          description: Chunks are missing, or the file type is not allowed (the upload is then discarded)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                message: 'Missing chunks: 3, 7.'
                errors: { chunks: ['Missing chunks: 3, 7.'] }

  /exports:
    get:
      operationId: listExports
      tags: [Exports]
      summary: List your exports
      description: Newest first, 15 per page. Exports are deleted after 7 days.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: A page of exports
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Export' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: createExport
      tags: [Exports]
      summary: Request a CSV or PDF export of tasks
      description: |
        Generated in the background. Accepts the same filters and sort as `GET /tasks` (except
        `per_page`). Poll `GET /exports/{export}` until `status` is `completed`. PDF exports are
        limited to 2000 tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format: { type: string, enum: [csv, pdf] }
                status: { $ref: '#/components/schemas/TaskStatus' }
                priority: { $ref: '#/components/schemas/TaskPriority' }
                assigned_user_id: { type: integer }
                created_by: { type: integer }
                search: { type: string, maxLength: 255 }
                sort: { type: string, enum: [title, status, priority, due_date, created_at] }
                direction: { type: string, enum: [asc, desc] }
            example: { format: csv, status: pending, sort: due_date, direction: asc }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Export' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /exports/{export}:
    get:
      operationId: getExport
      tags: [Exports]
      summary: Check an export
      description: Only the user who requested it can see it; anyone else gets 404.
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: The export
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Export' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /exports/{export}/download:
    get:
      operationId: downloadExport
      tags: [Exports]
      summary: Download a finished export
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: The CSV or PDF file
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Still being generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: This export is still being generated. }
        '410':
          description: Generation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: This export failed. Please request a new one. }

  /broadcasting/auth:
    post:
      operationId: authorizeChannel
      tags: [Broadcasting]
      summary: Authorize a private WebSocket channel
      description: |
        Called by Laravel Echo when subscribing. Channels:
        `private-tasks` (any signed-in user) and `private-tasks.{task}` (anyone who can view the task).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [socket_id, channel_name]
              properties:
                socket_id: { type: string, example: '1234.5678' }
                channel_name: { type: string, example: private-tasks.12 }
      responses:
        '200':
          description: Signed channel authorization
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: 'Not allowed on this channel, or the channel does not exist' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TaskId:
      name: task
      in: path
      required: true
      schema: { type: integer }
    AttachmentId:
      name: attachment
      in: path
      required: true
      schema: { type: integer }
    UploadId:
      name: upload
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExportId:
      name: export
      in: path
      required: true
      schema: { type: integer }

  responses:
    Unauthenticated:
      description: Missing, expired or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Unauthenticated. }
    Forbidden:
      description: Signed in, but not allowed to do this
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: This action is unauthorized. }
    NotFound:
      description: The resource does not exist (or belongs to another user, for private resources)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: The input is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
          example:
            message: The title field is required.
            errors: { title: [The title field is required.] }
    TooManyRequests:
      description: Rate limit exceeded. Wait for the number of seconds in the `Retry-After` header.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Too Many Attempts. }

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    Paginated:
      type: object
      properties:
        links:
          type: object
          properties:
            first: { type: [string, 'null'] }
            last: { type: [string, 'null'] }
            prev: { type: [string, 'null'] }
            next: { type: [string, 'null'] }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            from: { type: [integer, 'null'] }
            last_page: { type: integer }
            path: { type: string }
            per_page: { type: integer }
            to: { type: [integer, 'null'] }
            total: { type: integer }

    Role:
      type: string
      enum: [admin, member]

    TaskStatus:
      type: string
      enum: [pending, in_progress, completed, cancelled]

    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }

    AuthUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            email_verified_at: { type: [string, 'null'], format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    TaskInput:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TaskStatus', default: pending }
        priority: { $ref: '#/components/schemas/TaskPriority', default: medium }
        assigned_user_id: { type: [integer, 'null'] }
        due_date: { type: [string, 'null'], format: date }

    Task:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        due_date: { type: [string, 'null'], format: date }
        assigned_user:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
        creator: { $ref: '#/components/schemas/User' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        can:
          type: object
          description: What the signed-in user may do with this task.
          properties:
            update: { type: boolean }
            delete: { type: boolean }

    Comment:
      type: object
      properties:
        id: { type: integer }
        task_id: { type: integer }
        comment: { type: string }
        user: { $ref: '#/components/schemas/User' }
        created_at: { type: string, format: date-time }

    Attachment:
      type: object
      properties:
        id: { type: integer }
        task_id: { type: integer }
        version: { type: integer, minimum: 1 }
        file_name: { type: string }
        file_size: { type: integer, description: Bytes }
        mime_type: { type: string }
        scan_status: { type: string, enum: [pending, clean, infected] }
        scanned_at: { type: [string, 'null'], format: date-time }
        uploaded_at: { type: string, format: date-time }
        download_url: { type: string, format: uri }
        versions_url: { type: string, format: uri }
        thumbnail_url: { type: [string, 'null'], format: uri, description: 'Images, and poster frames of videos' }
        stream_status:
          type: [string, 'null']
          enum: [pending, ready, failed, null]
          description: 'Videos only: progress of the HLS stream. `null` for other files, and for videos not yet scanned.'
        stream_url: { type: [string, 'null'], format: uri, description: 'The master playlist, once `stream_status` is `ready`' }
        duration: { type: [number, 'null'], description: 'Video length in seconds' }

    ChunkedUpload:
      type: object
      properties:
        id: { type: string, format: uuid }
        task_id: { type: integer }
        file_name: { type: string }
        file_size: { type: integer, description: Bytes }
        chunk_size: { type: integer, description: 'Bytes per chunk (5 MB by default)' }
        total_chunks: { type: integer }
        received_chunks:
          type: array
          items: { type: integer }
        expires_at: { type: string, format: date-time }

    BulkOperation:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Set 3 tasks to completed }
        status: { type: string, enum: [processing, finished, cancelled] }
        task_count: { type: integer }
        progress: { type: integer, minimum: 0, maximum: 100, description: Percent of jobs processed }
        total_jobs: { type: integer }
        processed_jobs: { type: integer }
        failed_jobs: { type: integer }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    Export:
      type: object
      properties:
        id: { type: integer }
        format: { type: string, enum: [csv, pdf] }
        status: { type: string, enum: [pending, processing, completed, failed] }
        filters:
          type: object
          description: The filters and sort the export was requested with.
        row_count: { type: [integer, 'null'] }
        download_url: { type: [string, 'null'], format: uri, description: Set once the export is completed. }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
